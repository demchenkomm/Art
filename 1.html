<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>10 клас - Калашник</title>
<style>
table {
border-collapse: collapse;
width: 400px;
height: 400px;
margin: 50px auto;
}
td {
border: 5px solid white;
}
.yellow { background: yellow; }
.orange { background: orange; }
.pink { background: hotpink; }
.green { background: green; }
.darkgreen { background: darkgreen; }
.blue { background: blue; }
.red { background: red; }
</style>
</head>
<body>

<table>
<tr>
<td class="yellow" rowspan="4"></td>
<td class="orange" colspan="3"></td>
</tr>
<tr>
<td class="pink" colspan="2"></td>
<td class="yellow" rowspan="2"></td>
<td class="darkgreen" rowspan="4"></td>
</tr>
<tr>
<td class="green" rowspan="2"></td>
<td class="blue"></td>
</tr>
<tr>
<td class="red" colspan="2"></td>
</tr>
<tr>
<td class="orange" colspan="4"></td>
</tr>
</table>

</body>
</html>
